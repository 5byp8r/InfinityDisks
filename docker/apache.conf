<VirtualHost *:80>
    DocumentRoot /var/www/html
    RedirectMatch 302 ^/$ /view/Main.php

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/model>
        Require all denied
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
